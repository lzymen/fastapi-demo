[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "aiofiles>=22.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "bcrypt>=4.0.0,<5.0.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.poe.tasks]
dev = "uvicorn main:app --reload"
dev-external = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
test = "pytest"
